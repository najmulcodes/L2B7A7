<svg width="560" height="440" viewBox="0 0 560 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An assessment panel showing scored code review lines next to a pass badge">
  <defs>
    <linearGradient id="hero-grad" x1="40" y1="20" x2="520" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a5cf5" />
      <stop offset="1" stop-color="#7b61ff" />
    </linearGradient>
    <linearGradient id="hero-grad-soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a5cf5" stop-opacity="0.18" />
      <stop offset="1" stop-color="#7b61ff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="558" height="438" rx="24" fill="#121216" stroke="#232330" />

  <circle cx="470" cy="60" r="140" fill="url(#hero-grad-soft)" />

  <!-- editor chrome -->
  <circle cx="44" cy="44" r="5" fill="#44445a" />
  <circle cx="62" cy="44" r="5" fill="#44445a" />
  <circle cx="80" cy="44" r="5" fill="#44445a" />
  <rect x="40" y="70" width="230" height="10" rx="5" fill="#2b2b38" />

  <!-- code lines (varying widths = "code", not literal text) -->
  <g>
    <rect x="40" y="110" width="120" height="8" rx="4" fill="#3a3a4a" />
    <rect x="170" y="110" width="60" height="8" rx="4" fill="url(#hero-grad)" opacity="0.9" />

    <rect x="56" y="134" width="90" height="8" rx="4" fill="#3a3a4a" />
    <rect x="156" y="134" width="150" height="8" rx="4" fill="#2b2b38" />

    <rect x="56" y="158" width="130" height="8" rx="4" fill="#2b2b38" />

    <rect x="40" y="182" width="40" height="8" rx="4" fill="#3a3a4a" />
    <rect x="88" y="182" width="170" height="8" rx="4" fill="#2b2b38" />

    <rect x="40" y="218" width="100" height="8" rx="4" fill="#3a3a4a" />
    <rect x="150" y="218" width="80" height="8" rx="4" fill="url(#hero-grad)" opacity="0.9" />

    <rect x="56" y="242" width="190" height="8" rx="4" fill="#2b2b38" />
    <rect x="56" y="266" width="140" height="8" rx="4" fill="#2b2b38" />

    <rect x="40" y="300" width="60" height="8" rx="4" fill="#3a3a4a" />
    <rect x="108" y="300" width="110" height="8" rx="4" fill="#2b2b38" />
  </g>

  <!-- timer pill, bottom-left: ties to "timed attempt" -->
  <rect x="40" y="360" width="118" height="34" rx="17" fill="#1b1b24" stroke="#2b2b38" />
  <circle cx="63" cy="377" r="8" fill="none" stroke="#9aa0ff" stroke-width="2.5" />
  <path d="M63 372v5l3.5 3.5" stroke="#9aa0ff" stroke-width="2.5" stroke-linecap="round" />
  <rect x="80" y="372" width="62" height="8" rx="4" fill="#3a3a4a" />

  <!-- pass badge -->
  <g>
    <circle cx="452" cy="300" r="76" fill="#15151b" stroke="#2b2b38" stroke-width="2" />
    <circle cx="452" cy="300" r="76" fill="none" stroke="url(#hero-grad)" stroke-width="6" stroke-dasharray="402" stroke-dashoffset="40" stroke-linecap="round" transform="rotate(-90 452 300)" />
    <path d="M420 300l22 22 46-54" fill="none" stroke="url(#hero-grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <rect x="396" y="396" width="112" height="22" rx="11" fill="url(#hero-grad)" opacity="0.15" />
  <rect x="412" y="402" width="80" height="9" rx="4.5" fill="url(#hero-grad)" />
</svg>
